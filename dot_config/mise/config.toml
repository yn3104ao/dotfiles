# ===============
# Task Runner
# ===============
[tasks.playground]
description = "Experimental container supporting 1Password Signing"
run = """
nerdctl run -it --rm \
  -v "$HOME:$HOME" \
  -v "$SSH_AUTH_SOCK:$SSH_AUTH_SOCK" \
  -e "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" \
  -e "HOME=$HOME" \
  -w "$HOME" \
  --user "$(id -u):$(id -g)" \
  ubuntu:24.04 bash
"""

[tasks."dind:up"]
description = "Start a rootful Docker-in-Docker daemon"
run = """
  sudo nerdctl run -d --name dind \
    --privileged \
    -p 127.0.0.1:2375:2375 \
    -e DOCKER_TLS_CERTDIR="" \
    -v "$@":/var/lib/docker \
    docker.io/docker:dind
"""
