# ~/.config/helix/languages.toml

# --------------------------------------------------------
# File type mapping for version control (Git / Jujutsu)
# --------------------------------------------------------
[[language]]
name = "git-commit"
# Also color temporary files generated by jj as git-commit
file-types = ["COMMIT_EDITMSG", "MERGE_MSG", "JJ-INSTRUCTIONS", { glob = "jj-commit-*" }]

# --------------------------------------------------------
# 1. Rust (LSP: rust-analyzer, Formatter: rustfmt)
# --------------------------------------------------------
[[language]]
name = "rust"
auto-format = true
# * Rust works with just this because the standard configuration is perfect

# --------------------------------------------------------
# 2. TypeScript (LSP: typescript-language-server, Formatter: prettier)
# --------------------------------------------------------
[[language]]
name = "typescript"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "typescript"] }

# --------------------------------------------------------
# 3. Python (LSP/Formatter: ruff) * Super-fast Ruff recommended
# --------------------------------------------------------
[[language]]
name = "python"
auto-format = true
# Nowadays, ruff is the only choice for both formatter and linter in Python
formatter = { command = "ruff", args = ["format", "-"] }

# --------------------------------------------------------
# 4. Go (LSP/Formatter: gopls)
# --------------------------------------------------------
[[language]]
name = "go"
auto-format = true
# Go's official tool (gopls) is also excellent, so minimal specification is OK

# --------------------------------------------------------
# 5. C# (LSP: csharp-ls)
# --------------------------------------------------------
[[language]]
name = "c-sharp"
auto-format = true

# --------------------------------------------------------
# 6. Markdown (Formatter: prettier)
# --------------------------------------------------------
[[language]]
name = "markdown"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "markdown"] }

# --------------------------------------------------------
# 7. ShellScript (Formatter: shfmt)
# --------------------------------------------------------
[[language]]
name = "bash"
auto-format = true
formatter = { command = "shfmt", args = ["-i", "2"] }
